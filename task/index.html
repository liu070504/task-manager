<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>任务管理</title>
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>

  <header class="header">
  <h1>Task Manager</h1>
  <input type="text" placeholder="搜索任务..." />
  <button>新建任务</button>
</header>
  <div class="container">

  <!-- 左侧导航 -->
  <nav class="sidebar">
    <ul>
      <li class="active">Dashboard</li>
      <li>My Tasks</li>
      <li>Settings</li>
    </ul>
  </nav>

  <!-- 右侧内容 -->
  <section class="cards">
  <div class="card">今日待办：5</div>
  <div class="card">已完成：12</div>
</section>
</div>
<section class="tasks">
  <div class="task">
    <span>写作业</span>
    <span>2026-04-22</span>
    <span class="doing">进行中</span>
  </div>

  <div class="task">
    <span>复习HTML</span>
    <span>2026-04-23</span>
    <span class="done">已完成</span>
  </div>
</section>
</body>
</html>
