<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>任务管理</title>
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>

  <!-- 顶部 -->
  <header class="header">
    <h1>Task Manager</h1>
    <input type="text" placeholder="搜索任务..." />
    <button onclick="addTask()">新建任务</button>
  </header>

  <div class="container">

    <!-- 左侧导航 -->
    <nav class="sidebar">
      <ul>
        <li class="active" onclick="setActive(this)">Dashboard</li>
        <li onclick="setActive(this)">My Tasks</li>
        <li onclick="setActive(this)">Settings</li>
      </ul>
    </nav>

    <!-- 右侧内容 -->
    <section class="cards">
      <div class="card">今日待办：5</div>
      <div class="card">已完成：12</div>
    </section>

  </div>

  <!-- 任务列表 -->
  <section class="tasks">
    <div class="task" onclick="toggleStatus(this)">
      <span>写作业</span>
      <span>2026-04-22</span>
      <span class="doing">进行中</span>
    </div>

    <div class="task" onclick="toggleStatus(this)">
      <span>复习HTML</span>
      <span>2026-04-23</span>
      <span class="done">已完成</span>
    </div>
  </section>

  <script>
    // 设置导航的选中状态
    function setActive(el) {
      let items = document.querySelectorAll('.sidebar li');
      items.forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    }

    // 新建任务功能
    function addTask() {
      const name = prompt("请输入任务名称");
      if (!name) return;

      const taskList = document.querySelector('.tasks');

      const div = document.createElement('div');
      div.className = 'task';
      div.setAttribute('onclick', 'toggleStatus(this)');

      div.innerHTML = `
        <span>${name}</span>
        <span>2026-04-30</span>
        <span class="doing">进行中</span>
      `;

      taskList.appendChild(div);
    }

    // 切换任务状态
    function toggleStatus(task) {
      let status = task.querySelector('span:last-child');

      if (status.classList.contains('doing')) {
        status.classList.remove('doing');
        status.classList.add('done');
        status.innerText = '已完成';
      } else {
        status.classList.remove('done');
        status.classList.add('doing');
        status.innerText = '进行中';
      }
    }
  </script>

</body>
</html>
